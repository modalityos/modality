<!-- @dsCard height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap">
<style>
  body{margin:0;background:var(--bg)}
  .c{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden}
  svg{position:absolute;left:480px;top:0}
  .w1{fill:var(--wallpaper-1)} .w2{fill:var(--wallpaper-2)} .w3{fill:var(--wallpaper-3)} .acc{fill:var(--accent)} .glass{fill:var(--material-popover-fallback)}
  .name{position:absolute;left:40px;bottom:64px;max-width:420px;font:700 64px/.95 var(--font-sans);letter-spacing:-.03em;color:var(--text-primary)}
  .tag{position:absolute;left:40px;bottom:36px;max-width:420px;font:400 14px/20px var(--font-sans);color:var(--text-secondary)}
</style>
<div class="c">
  <!-- blocks: wallpaper-1 / wallpaper-2 / wallpaper-3 slabs (radius-panel 16), accent disc, one material-popover-fallback pill
       arrangement: a strip of unequal bands bleeding off the top and right, like the wallpaper the system sits on
       pattern: pills and discs from radius-pill: frosted glass floating over colour is this system's signature
       steps and radii: space-4, space-6, space-8; radius-card, radius-panel, radius-pill -->
  <svg width="480" height="300" viewBox="0 0 480 300">
    <rect class="w1" x="24" y="-16" width="152" height="244" rx="16"/>
    <rect class="w2" x="192" y="-16" width="152" height="300" rx="16"/>
    <rect class="w3" x="360" y="40" width="152" height="244" rx="16"/>
    <rect class="glass" x="72" y="176" width="224" height="40" rx="20"/>
    <circle class="acc" cx="276" cy="196" r="14"/>
    <rect class="glass" x="232" y="64" width="160" height="32" rx="16"/>
    <circle class="acc" cx="96" cy="72" r="24"/>
  </svg>
  <div class="name">ModalityOS Foundations</div>
  <div class="tag">Calm and clear: frosted glass over colour.</div>
</div>
