<!-- @dsCard group="Scenes" height=560 width=960 subtitle="A login screen over the wallpaper, built only from Tokens" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:400 13px/16px var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  .s{position:relative;width:960px;height:540px;overflow:hidden;background:linear-gradient(var(--wallpaper-angle),var(--wallpaper-1),var(--wallpaper-2) var(--wallpaper-mid-stop),var(--wallpaper-3));display:flex;flex-direction:column;align-items:center}
  .date{margin-top:48px;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em}
  .clock{font-size:96px;line-height:100px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .who{margin-top:auto;margin-bottom:64px;display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
  .av{width:var(--avatar-size-large);height:var(--avatar-size-large);border-radius:var(--radius-pill);display:grid;place-items:center;font-size:34px;font-weight:600;color:var(--on-accent);background:linear-gradient(160deg,var(--accent-hover),var(--accent-pressed));box-shadow:var(--shadow-floating)}
  .name{font-size:15px;line-height:20px;font-weight:600}
  .pw{display:flex;align-items:center;gap:var(--space-2);width:240px;height:var(--control-height-large);padding:0 4px 0 var(--space-4);border-radius:var(--radius-pill);background:var(--material-popover-tint);backdrop-filter:blur(var(--material-popover-blur)) saturate(var(--material-saturation));box-shadow:var(--shadow-floating);outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--focus-ring-offset)}
  .pw span{flex:1;color:var(--text-tertiary)}
  .go{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
  .caps{display:flex;align-items:center;gap:6px;padding:4px var(--space-3);border-radius:var(--radius-pill);font-size:11px;line-height:14px;background:var(--material-popover-tint);backdrop-filter:blur(var(--material-popover-blur));color:var(--warning);font-weight:500}
  .power{position:absolute;bottom:20px;display:flex;gap:var(--space-8)}
  .p{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;line-height:14px;font-weight:500}
  .p i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--material-popover-tint);backdrop-filter:blur(var(--material-popover-blur));box-shadow:var(--shadow-raised);color:var(--text-primary)}
  .p svg{width:16px;height:16px}
</style>
<div class="s">
  <div class="date">Friday 9 October</div>
  <div class="clock">09:41</div>
  <div class="who">
    <div class="av">JD</div>
    <div class="name">John Doe</div>
    <div class="pw"><span>Enter password</span><div class="go"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5"/></svg></div></div>
    <div class="caps"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 1L1.5 5H3.5v2.5h3V5h2zM3.5 9h3"/></svg>Caps Lock is on</div>
  </div>
  <div class="power">
    <div class="p"><i><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12.5 10A5.5 5.5 0 0 1 6 3.5a5.5 5.5 0 1 0 6.5 6.5z"/></svg></i>Sleep</div>
    <div class="p"><i><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></i>Restart</div>
    <div class="p"><i><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5v6M4.5 3.8a5 5 0 1 0 7 0"/></svg></i>Shut Down</div>
  </div>
</div>
